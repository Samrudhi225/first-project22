<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="recipe">
        <h3>Pizza</h3>
        <div class="recipe-info">
          <img
            src="https://img.freepik.com/free-psd/delicious-pepperoni-pizza-culinary-delight_632498-24206.jpg"

          />
          <a href="https://www.zomato.com/pune/delivery/dish-pizza">pizza</a>

        </div>
      </div>

      <div class="recipe">
        <h3>Burger</h3>
        <div class="recipe-info">
          <img
            src="https://img.freepik.com/free-photo/delicious-burger-studio_23-2151846495.jpg?semt=ais_hybrid&w=740&q=80"

      </div>

        <h3>Pasta</h3>
        <div class="recipe-info">
          <img
            src="https://img.freepik.com/free-photo/penne-pasta-tomato-sauce-with-chicken-tomatoes-wooden-table_2829-19744.jpg?semt=ais_hybrid&w=740&q=80"

          />
          <a
            href="https://nfcihospitality.com/popular-types-of-pasta-in-india-best-pasta/"

</html>
